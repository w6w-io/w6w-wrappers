# Packaging manifest for the `w6w` Python client.
#
# Two rules govern this file and neither is a preference:
#
# 1. `version` is written from the wrappers' shared VERSION contract, never
#    edited on its own. `tests/test_version.py` fails if it drifts from
#    `src/w6w/_version.py` or from that shared file.
# 2. `dependencies` stays EMPTY. Transport is `urllib.request` from the
#    standard library. See README "Zero runtime dependencies".

[build-system]
# PEP 639 SPDX `license` + `license-files` need setuptools >= 77.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "w6w"
version = "0.4.0"
description = "Typed, dependency-free Python client for the w6w workflow API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "w6w" }]
keywords = ["w6w", "workflow", "automation", "api", "client", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# INTENTIONALLY EMPTY. A published client that pins `requests` or `httpx`
# conflicts with its users' own pins, and neither can be installed in the
# environment that develops this package (there is no pip here).
dependencies = []

[project.optional-dependencies]
# Coverage only. It is never needed to RUN the suite — see README "Tests".
dev = ["coverage>=7.0"]

[project.urls]
# The wrappers share one repo, one directory per language. These pointed at
# w6w-io/w6w-python, which was specced but never created.
Homepage = "https://github.com/w6w-io/w6w-wrappers/tree/main/python"
Repository = "https://github.com/w6w-io/w6w-wrappers"
Issues = "https://github.com/w6w-io/w6w-wrappers/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the marker must ship inside the wheel, or type checkers ignore
# every annotation in this package.
w6w = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["src/w6w"]

[tool.coverage.report]
# The gate lives here so CI only has to run `coverage report`.
fail_under = 90
show_missing = true
