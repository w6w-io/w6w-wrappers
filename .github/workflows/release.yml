name: Release

# Publishes the wrappers — tokenless, over OIDC. No stored registry credential
# exists in this repo, and none should ever be added: every upload mints a
# short-lived one from the workflow's own identity.
#
# THE FILENAME IS PART OF THE CREDENTIAL. Trusted publishing binds to
# `owner/repo` PLUS this file's name (and, for PyPI, the environment). Renaming
# `release.yml` silently invalidates every publisher registration. Don't.
#
# One-time setup (docs/release.md §Before any of this can run):
#   PyPI — pypi.org → Your projects → Publishing → add a GitHub "pending"
#          publisher:  project `w6w`, owner `w6w-io`, repository
#          `w6w-wrappers`, workflow `release.yml`, environment `pypi`.
#          Pending, because the project does not exist yet: the first run of
#          this workflow creates it. The name is NOT reserved until then.
#   The `pypi` GitHub environment must exist (Settings → Environments) and its
#   name must match the publisher registration exactly.
#
# Release flow: bump VERSION + every manifest, commit, then publish a GitHub
# Release tagged `vX.Y.Z`. `workflow_dispatch` runs the gates WITHOUT
# publishing — use it as a dry run.

on:
  release:
    types: [published]
  workflow_dispatch:

# Required for OIDC. This is what replaces stored tokens.
permissions:
  contents: read
  id-token: write

jobs:
  # ── The lockstep gate ──────────────────────────────────────────────────────
  # One version, ten places it is written down. This job is the reason a human
  # only ever types the new number into VERSION: everything else is compared
  # against it, and a release stops here rather than shipping a set that
  # disagrees with itself.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: VERSION, the release tag and every manifest must agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys

          root = pathlib.Path(".")
          shared = (root / "VERSION").read_text().strip()

          def from_json(path, *keys):
              data = json.loads((root / path).read_text())
              for key in keys:
                  data = data[key]
              return data

          def from_regex(path, pattern):
              text = (root / path).read_text()
              match = re.search(pattern, text, re.M)
              if not match:
                  sys.exit(f"::error::no version literal matched in {path}")
              return match.group(1)

          found = {
              "VERSION": shared,
              "node/package.json": from_json("node/package.json", "version"),
              "node/deno.json": from_json("node/deno.json", "version"),
              "node/src/version.ts": from_regex(
                  "node/src/version.ts", r'VERSION:\s*string\s*=\s*"([^"]+)"'),
              "cli/package.json": from_json("cli/package.json", "version"),
              "cli/deno.json": from_json("cli/deno.json", "version"),
              "cli/mod.ts": from_regex(
                  "cli/mod.ts", r'VERSION:\s*string\s*=\s*"([^"]+)"'),
              "python/pyproject.toml": from_regex(
                  "python/pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              "python/src/w6w/_version.py": from_regex(
                  "python/src/w6w/_version.py", r'__version__:\s*str\s*=\s*"([^"]+)"'),
              "react/package.json": from_json("react/package.json", "version"),
              "react/src/version.ts": from_regex(
                  "react/src/version.ts", r'VERSION:\s*string\s*=\s*"([^"]+)"'),
          }

          tag = os.environ.get("TAG", "").strip()
          if tag:
              found["release tag"] = tag[1:] if tag.startswith("v") else tag

          # Echo everything BEFORE deciding: when this fails, the log should
          # already answer "which one disagreed" without a re-run.
          width = max(len(name) for name in found)
          for name, value in found.items():
              print(f"  {name:<{width}}  {value}")

          wrong = {n: v for n, v in found.items() if v != shared}
          if wrong:
              for name, value in wrong.items():
                  print(f"::error::{name} is {value}, but VERSION is {shared}")
              sys.exit(1)
          print(f"\nall {len(found)} agree on {shared}")
          PY

  # ── Every lane's suite, including its conformance test ─────────────────────
  # The conformance runners live inside these suites (python/tests/test_surface.py,
  # cli/tests/help_test.ts, and each lane's version guard), and they read
  # endpoints.json and VERSION from THIS checkout as siblings. That is the whole
  # reason the wrappers share a repo: an operation added to two lanes and
  # forgotten in a third fails here, before anything is uploaded.
  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: python — unittest (no install step, no third-party runner)
        working-directory: python
        run: PYTHONPATH=src python3 -m unittest discover -s tests -t .

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: node — deno test
        working-directory: node
        run: deno task test
      - name: cli — deno test
        working-directory: cli
        run: deno task test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The react lane imports `@w6w/sdk/console`, a subpath no PUBLISHED @w6w/sdk carries yet.
      # Build the sibling out of this checkout and install it over the registry copy, so the suite
      # measures the source of truth in this commit rather than the last release. Keep this step even
      # after a console-bearing @w6w/sdk ships: every other lane already tests against the sibling, and
      # a test job that silently measures a stale published package is the failure this repo's
      # one-repo layout exists to prevent.
      - name: node — build the SDK the react lane imports
        working-directory: node
        run: npm install && npm run build
      - name: react — its own suite, against that build
        working-directory: react
        run: |
          npm install
          npm install --no-save ../node
          npm test

  # ── PyPI ───────────────────────────────────────────────────────────────────
  pypi:
    needs: [verify, test]
    # Never on a dry run: workflow_dispatch stops after the gates above.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # MUST match the environment named in the PyPI publisher registration —
    # it travels in the OIDC claim, and a mismatch is rejected at upload.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # `build` is the only tool this needs, and it is a CI-only dependency:
      # the package itself has zero runtime dependencies and its suite runs on
      # the standard library alone.
      - run: python -m pip install --upgrade build
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build --outdir dist

      # No token, no `twine`, no password. The action exchanges this job's OIDC
      # identity for a short-lived upload credential.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Relative to the workspace root: this step does not inherit the
          # working-directory above, because it runs as a container action.
          packages-dir: python/dist

  # ── npm ────────────────────────────────────────────────────────────────────
  # Same OIDC posture as PyPI: npm >= 11.5.1 detects the trusted publisher
  # itself, no NODE_AUTH_TOKEN anywhere. This repo is public, so `--provenance`
  # would work, but it stays off by deliberate, separate decision — see
  # FOLLOWUPS.md (G-8) and docs/release.md's --provenance paragraph.
  npm-sdk:
    needs: [verify, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@latest
      - name: Install + build
        working-directory: node
        run: |
          npm install
          npm run build
      - name: Publish @w6w/sdk
        working-directory: node
        run: npm publish --access public

  npm-cli:
    # After npm-sdk, not just verify+test: cli declares a real npm dependency
    # on "@w6w/sdk": "^0.2.0", so its `npm install` below needs that version
    # already live on the registry — otherwise it resolves to nothing (there is
    # no 0.2.0 yet) and the install fails.
    needs: [verify, test, npm-sdk]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@latest
      - name: Install + build
        working-directory: cli
        run: |
          npm install
          npm run build
      - name: Publish @w6w/cli
        working-directory: cli
        run: npm publish --access public

  npm-react:
    needs: [verify, test, npm-sdk]
    # After npm-sdk, not just verify+test: react declares a real npm dependency on
    # "@w6w/sdk" and resolves it from the registry below. Two independent reasons it
    # has to be the copy THIS release just published. First, the range tracks
    # VERSION — `react/src/__tests__/version.test.ts` pins that — so at release time
    # it names a version only `npm-sdk` can have created. Second, and easy to miss:
    # every `@w6w/sdk` published before this lane existed lacks the `./console`
    # subpath that `react/src/adapter.ts` is built on (`npm view @w6w/sdk@0.3.0
    # exports` returns the root export alone), so an older copy does not merely
    # mismatch — it cannot satisfy the imports at all. Unlike the `test` job's own react step,
    # this one does NOT substitute the sibling build: a publish job must build
    # against exactly what consumers will resolve, and by the time this job runs
    # `npm-sdk` has already uploaded, so the registry copy is the real, current one.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@latest
      - name: Install + build
        working-directory: react
        run: |
          npm install
          npm run build
      - name: Publish @w6w/react
        working-directory: react
        run: npm publish --access public

  # ── JSR ────────────────────────────────────────────────────────────────────
  # No build step: JSR publishes the authored .ts source verbatim (D7), the
  # same files `deno task check`/`test` already run against. `npx jsr publish`
  # picks up the OIDC token from `id-token: write` with no login step.
  jsr-sdk:
    needs: [verify, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish @w6w/sdk to JSR
        working-directory: node
        run: npx --yes jsr publish

  jsr-cli:
    needs: [verify, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish @w6w/cli to JSR
        working-directory: cli
        run: npx --yes jsr publish
